<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast checker</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:1fr auto;font:1rem/1.5 "IBM Plex Sans Hebrew",system-ui,sans-serif}
#view{display:grid;place-content:center;text-align:center;padding:2rem}
#ratio{font-size:clamp(3rem,14vw,6rem);font-weight:600;line-height:1.1}
p{margin:0}
form{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:center;padding:1.25rem;background:#fff;color:#2a3045;border-top:1px solid #dcdfe9}
label{display:flex;align-items:center;gap:.6rem}
input{width:3.5rem;height:2.5rem;padding:2px}
</style>
</head>
<body>
<div id="view" aria-live="polite"><p id="ratio" dir="ltr"></p><p id="verdict"></p></div>
<form>
  <label><span id="l1"></span><input id="fg" type="color" value="#f8f8fb"></label>
  <label><span id="l2"></span><input id="bg" type="color" value="#505d94"></label>
</form>
<script>
let lang;
try { lang = localStorage.getItem("lang"); } catch {}
const he = lang ? lang === "he" : /^(he|iw)/.test(navigator.language);
const $ = id => document.getElementById(id);
document.documentElement.lang = he ? "he" : "en";
document.documentElement.dir = he ? "rtl" : "ltr";
$("l1").textContent = he ? "צבע הטקסט" : "Text color";
$("l2").textContent = he ? "צבע הרקע" : "Background color";
const weights = [.2126, .7152, .0722];
const lum = c => [1, 3, 5].reduce((sum, at, i) => {
  const v = parseInt(c.slice(at, at + 2), 16) / 255;
  return sum + weights[i] * (v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
}, 0);
function update() {
  const f = $("fg").value, b = $("bg").value;
  const [lo, hi] = [lum(f), lum(b)].sort((x, y) => x - y), r = (hi + .05) / (lo + .05);
  $("view").style.color = f;
  $("view").style.background = b;
  $("ratio").textContent = (Math.floor(r * 100) / 100).toFixed(2) + ":1";
  $("verdict").textContent = r >= 7 ? (he ? "קריאות מצוינת (AAA)" : "Excellent (AAA)")
    : r >= 4.5 ? (he ? "קריא (AA)" : "Readable (AA)")
    : r >= 3 ? (he ? "מתאים רק לטקסט גדול" : "Large text only")
    : (he ? "קשה לקריאה" : "Hard to read");
}
$("fg").oninput = $("bg").oninput = update;
update();
</script>
</body>
</html>
